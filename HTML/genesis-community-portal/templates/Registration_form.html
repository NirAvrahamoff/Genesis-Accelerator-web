<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Genesis Accelerator - Apply</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin:0;
      background:#0e1015;
      color:#fff;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    .card {
      background:#11131a;
      border:1px solid #22263a;
      border-radius:16px;
      padding:22px;
    }

    a { color:#bfc4ff; text-decoration:none; }

    h1 { margin: 8px 0 18px 0; }

    h3 { margin-top:22px; }

    label {
      display:block;
      margin-top:14px;
      font-weight: bold;
    }

    .req { color:#ff7a7a; }

    input, select, textarea {
      width:100%;
      margin-top:8px;
      padding:10px 12px;
      background:#0f1220;
      border:1px solid #2a2f4a;
      border-radius:10px;
      color:#fff;
      box-sizing:border-box;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    @media (max-width: 800px){
      .row{ grid-template-columns:1fr; }
    }

    /* ---------- Checkbox layout ---------- */

    .checkbox-grid {
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:10px;
    }

    @media (min-width:700px){
      .checkbox-grid {
        grid-template-columns:1fr 1fr;
      }
    }

    .check-row {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      background:#0f1220;
      border:1px solid #2a2f4a;
      border-radius:10px;
      padding:10px 12px;
      font-weight:normal;
    }

    .check-row span {
      line-height:1.4;
    }

    .check-row input[type="checkbox"] {
      margin-top:2px;
      width:18px;
      height:18px;
      flex-shrink:0;
    }

    /* ---------- Buttons ---------- */

    .btn {
      display:inline-block;
      margin-top:22px;
      padding:12px 22px;
      border-radius:12px;
      font-weight:bold;
      border:0;
      cursor:pointer;
    }

    .btn-primary {
      background:#6c63ff;
      color:#fff;
    }
  </style>
</head>

<body>
<div class="wrap">
  <a href="{{ url_for('landing') }}">← Back</a>

  <div class="card">

    <h1>Genesis Accelerator Application Form</h1>

    <form action="{{ url_for('submit') }}" method="post">

      <!-- Basic details -->
      <div class="row">
        <div>
          <label>Full Name <span class="req">*</span></label>
          <input name="full_name" required>
        </div>
        <div>
          <label>Email <span class="req">*</span></label>
          <input name="email" type="email" required>
        </div>
      </div>

      <div class="row">
        <div>
          <label>LinkedIn <span class="req">*</span></label>
          <input name="linkedin" required>
        </div>
        <div>
          <label>Phone Number <span class="req">*</span></label>
          <input name="phone" required>
        </div>
      </div>

      <div class="row">
        <div>
          <label>What's your role in the company? <span class="req">*</span></label>
          <input name="role_in_company" required>
        </div>
        <div>
          <label>Company Name <span class="req">*</span></label>
          <input name="company_name" required>
        </div>
      </div>

      <!-- Gain from program -->
      <h3>What do you hope to gain from the program? <span class="req">*</span></h3>

      <div class="checkbox-grid">
        <label class="check-row"><span>Mentoring</span><input type="checkbox" name="gain[]" value="Mentoring"></label>
        <label class="check-row"><span>Access to Customers or Design Partners</span><input type="checkbox" name="gain[]" value="Customers"></label>
        <label class="check-row"><span>Access to Investors / Fundraising support</span><input type="checkbox" name="gain[]" value="Investors"></label>
        <label class="check-row"><span>Educational content on company-building</span><input type="checkbox" name="gain[]" value="Education"></label>
        <label class="check-row"><span>Networking with fellow founders</span><input type="checkbox" name="gain[]" value="Networking"></label>
        <label class="check-row"><span>Technical Support</span><input type="checkbox" name="gain[]" value="Tech"></label>
        <label class="check-row"><span>Other</span><input type="checkbox" name="gain[]" value="Other"></label>
      </div>

      <!-- Startup details -->
      <div class="row">
        <div>
          <label>Startup sector</label>
          <select name="primary_sector">
            <option value="">Select sector</option>
            <option value="AI">AI</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
            <option value="FinTech">FinTech</option>
            <option value="Cyber">Cyber</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Health">Health</option>
            <option value="HealthTech">HealthTech</option>
            <option value="Climate">Climate</option>
            <option value="Energy">Energy</option>
            <option value="Renewable Energy">Renewable Energy</option>
            <option value="E-commerce">E-commerce</option>
            <option value="Retail">Retail</option>
            <option value="SaaS">SaaS</option>
            <option value="Software">Software</option>
            <option value="PropTech">PropTech</option>
            <option value="Real Estate">Real Estate</option>
            <option value="Automotive">Automotive</option>
            <option value="Industrial">Industrial</option>
            <option value="Robotics">Robotics</option>
            <option value="Data">Data</option>
            <option value="Cloud">Cloud</option>
            <option value="Mobile">Mobile</option>
            <option value="Security">Security</option>
            <option value="Payments">Payments</option>
            <option value="Quantum">Quantum</option>
          </select>
        </div>
      </div>


        <div>
          <label>Startup stage</label>
          <select name="startup_stage" required>
            <option value="">Select stage</option>
            <option value="Ideation">Ideation</option>
            <option value="Pre-Seed">Pre-Seed</option>
            <option value="Seed">Seed</option>
            <option value="Early revenue">Early revenue</option>
            <option value="Another">Another</option>
          </select>
        </div>
       </div>

      <div class="row">
        <div>
          <label>Co-founders count</label>
          <select name="cofounders_count" required>
            <option value="">Select</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">More than 2</option>
          </select>
        </div>

        <div>
          <label>How long have you been working on your Startup?</label>
          <select name="time_working_on_startup" required>
            <option value="">Select</option>
            <option value="lt_3">Less than 3 months</option>
            <option value="3_6">3–6 months</option>
            <option value="6_24">6 months – 2 years</option>
            <option value="gt_24">More than 2 years</option>
          </select>
        </div>
      </div>

      <label>Co-founders details</label>
      <textarea name="cofounders_details"></textarea>

      <label>When was the company founded?</label>
      <input type="date" name="company_founded_date"  min="2000-01-01" max="{{ today }}">

      <label>Startup description</label>
      <textarea name="startup_description"></textarea>

      <label>What makes your team unique?</label>
      <textarea name="team_unique"></textarea>

      <label>Who are your current customers?</label>
      <textarea name="current_customers"></textarea>

      <label>What are your goals for the next 6 months?</label>
      <textarea name="goals_next_6_months"></textarea>


     <div class="row">
      <div>
        <label>Have you raised any funding so far?</label>
        <select name="raised_funding">
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>

      <div>
        <label>Revenue over the past year</label>
        <select name="revenue_past_year">
          <option value="">Select</option>
          <option value="none">No revenue yet</option>
          <option value="lt_50k">Less than $50k</option>
          <option value="50_250k">$50k–$250k</option>
          <option value="250k_1m">$250k–$1M</option>
          <option value="gt_1m">$1M+</option>
        </select>
      </div>
    </div>

    <label>From whom?</label>
    <input name="funding_from_whom">



      <label>Website</label>
      <input name="website_link">

      <label>Have you participated in an accelerator before?</label>
      <input name="participated_accelerator">

      <label>How did you hear about us?</label>
      <input name="heard_about_us">

      <label>Additional information</label>
      <textarea name="additional_info"></textarea>

      <!-- Consent -->
      <label style="margin-top:22px;">Consent</label>
      <label class="check-row">
        <span>
          I agree that the personal information I provide will be collected and stored by Genesis Accelerator
          <span class="req">*</span>
        </span>
        <input type="checkbox" name="consent_accepted" required>
      </label>

      <button class="btn btn-primary" type="submit">Submit</button>

    </form>
  </div>
</div>
</body>
</html>
