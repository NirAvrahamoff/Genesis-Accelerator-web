<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Submitted | Genesis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#141826,#0b0e17);color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;}
    .card{background:#111428;padding:50px 40px;border-radius:20px;max-width:520px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,0.45);}
    .icon{font-size:60px;margin-bottom:20px;color:#6a7cff;}
    h1{font-size:32px;margin-bottom:16px;}
    p{font-size:16px;color:#cfd3ff;line-height:1.6;margin-bottom:18px;}
    .cta-btn{padding:14px 36px;font-size:16px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#6a7cff,#8b5cf6);border:none;border-radius:30px;cursor:pointer;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✔</div>
    <h1>Application Submitted</h1>
    <p>Thank you for applying. Your application has been received and is now under review.</p>
    <p>A confirmation email was sent (if email settings are configured).</p>
    <button class="cta-btn" onclick="window.location.href='{{ url_for('landing') }}'">Back to Home</button>
  </div>
</body>
</html>
